<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .card {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Muhammad Sohail</h2>
        <h3>Web Developer</h3>
        <p>I am learning HTML and CSS.</p>

        <button>Contact Me</button>
    </div>

</body>
</html>
